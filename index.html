<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor Telemetría Robot 3D</title>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      overflow: hidden;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    /* Panel Flotante de Control y Telemetría */
    .dashboard {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 20px;
      border-radius: 12px;
      width: 320px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      z-index: 10;
    }

    .title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .status-badge {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 20px;
      background: #ef4444;
      color: white;
    }

    .status-badge.connected {
      background: #10b981;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      font-weight: 600;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #1d4ed8;
    }

    .telemetry-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 16px;
    }

    .metric-card {
      background: rgba(15, 23, 42, 0.6);
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .metric-label {
      font-size: 0.7rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .metric-value {
      font-size: 1.1rem;
      font-weight: 700;
      color: #f1f5f9;
      margin-top: 4px;
    }

    .instructions-card {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.8rem;
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>

  <!-- CDNs Necesarios para Three.js y Controles de Cámara -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <!-- Dashboard de Interfaz -->
  <div class="dashboard">
    <div class="title">
      <span>Robot 3D Telemetry</span>
      <span id="status" class="status-badge">Desconectado</span>
    </div>
    
    <button id="connectBtn">Conectar Arduino / Serie</button>

    <div class="telemetry-grid">
      <div class="metric-card">
        <div class="metric-label">Pitch (X)</div>
        <div class="metric-value" id="val-pitch">0.0°</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Roll (Z)</div>
        <div class="metric-value" id="val-roll">0.0°</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Yaw (Y)</div>
        <div class="metric-value" id="val-yaw">0.0°</div>
      </div>
    </div>
  </div>

  <div class="instructions-card">
    🖱️ Clic + Arrastrar: Girar Cámara | Scroll: Zoom
  </div>

  <div id="canvas-container"></div>

  <script>
    // --- 1. CONFIGURACIÓN DE LA ESCENA 3D ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f172a);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 4, 7);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    // Controles interactivos con el ratón
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // Luces
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5, 10, 7);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // Rejilla de fondo
    const grid = new THREE.GridHelper(20, 20, 0x38bdf8, 0x334155);
    grid.position.y = -1.5;
    scene.add(grid);

    // --- 2. CONSTRUCCIÓN DEL ROBOT (Modelo 3D) ---
    const robotGroup = new THREE.Group();

    // Chasis principal
    const bodyGeo = new THREE.BoxGeometry(2.2, 0.5, 3.2);
    const bodyMat = new THREE.MeshPhongMaterial({ color: 0x2563eb, flatShading: true });
    const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
    bodyMesh.castShadow = true;
    robotGroup.add(bodyMesh);

    // Flecha indicadora de frente (Color Verde)
    const arrowGeo = new THREE.ConeGeometry(0.3, 0.8, 4);
    const arrowMat = new THREE.MeshPhongMaterial({ color: 0x10b981 });
    const arrowMesh = new THREE.Mesh(arrowGeo, arrowMat);
    arrowMesh.rotation.x = Math.PI / 2;
    arrowMesh.position.set(0, 0.3, -1.8);
    robotGroup.add(arrowMesh);

    // Ruedas laterales (Decorativas)
    const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.2, 16);
    const wheelMat = new THREE.MeshPhongMaterial({ color: 0x475569 });
    
    const wheelPositions = [
      [-1.2, 0, 1], [1.2, 0, 1],
      [-1.2, 0, -1], [1.2, 0, -1]
    ];

    wheelPositions.forEach(pos => {
      const wheel = new THREE.Mesh(wheelGeo, wheelMat);
      wheel.rotation.z = Math.PI / 2;
      wheel.position.set(...pos);
      robotGroup.add(wheel);
    });

    scene.add(robotGroup);

    // --- 3. LÓGICA DE ACTUALIZACIÓN Y ANIMACIÓN ---
    let targetRotation = { x: 0, y: 0, z: 0 };

    function animate() {
      requestAnimationFrame(animate);

      // Suavizado de movimiento (Interpolación Lerp)
      robotGroup.rotation.x += (targetRotation.x - robotGroup.rotation.x) * 0.2;
      robotGroup.rotation.y += (targetRotation.y - robotGroup.rotation.y) * 0.2;
      robotGroup.rotation.z += (targetRotation.z - robotGroup.rotation.z) * 0.2;

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // --- 4. COMUNICACIÓN WEB SERIAL API ---
    const connectBtn = document.getElementById('connectBtn');
    const statusBadge = document.getElementById('status');

    connectBtn.addEventListener('click', async () => {
      if ('serial' in navigator) {
        try {
          // Solicita el puerto COM al usuario
          const port = await navigator.serial.requestPort();
          await port.open({ baudRate: 115200 });

          // Cambiar estado visual
          statusBadge.innerText = "Conectado";
          statusBadge.classList.add("connected");
          connectBtn.innerText = "Desconectar / Cambiar Puerto";

          // Flujo de lectura
          const textDecoder = new TextDecoderStream();
          const readableStreamClosed = port.readable.pipeTo(textDecoder.writable);
          const reader = textDecoder.readable.getReader();

          let buffer = "";

          while (true) {
            const { value, done } = await reader.read();
            if (done) break;

            buffer += value;
            const lines = buffer.split('\n');
            buffer = lines.pop(); // Retener la línea incompleta

            for (const line of lines) {
              parseTelemetry(line.trim());
            }
          }
        } catch (err) {
          console.error("Error al conectar:", err);
          alert("No se pudo conectar al puerto serie. Asegúrate de cerrar el Monitor Serie del Arduino IDE.");
        }
      } else {
        alert("Tu navegador no soporta Web Serial API. Por favor, utiliza Google Chrome o Microsoft Edge.");
      }
    });

    // Procesar datos CSV (pitch,roll,yaw)
    function parseTelemetry(data) {
      const parts = data.split(',');
      if (parts.length >= 3) {
        const pitch = parseFloat(parts[0]);
        const roll = parseFloat(parts[1]);
        const yaw = parseFloat(parts[2]);

        if (!isNaN(pitch) && !isNaN(roll) && !isNaN(yaw)) {
          // Actualizar dashboard
          document.getElementById('val-pitch').innerText = pitch.toFixed(1) + '°';
          document.getElementById('val-roll').innerText = roll.toFixed(1) + '°';
          document.getElementById('val-yaw').innerText = yaw.toFixed(1) + '°';

          // Convertir grados a radianes para Three.js
          targetRotation.x = THREE.MathUtils.degToRad(pitch);
          targetRotation.z = THREE.MathUtils.degToRad(-roll);
          targetRotation.y = THREE.MathUtils.degToRad(yaw);
        }
      }
    }

    // Redimensionamiento responsive
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
